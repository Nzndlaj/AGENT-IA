name: render-reel

on:
  workflow_dispatch:
    inputs:
      reel_id:
        description: "UUID de la ligne ig_reels à rendre"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Installer ffmpeg et polices
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances Python
        run: pip install -r render/requirements.txt

      - name: Rendu de la vidéo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REEL_ID: ${{ inputs.reel_id }}
        run: python render/render.py
